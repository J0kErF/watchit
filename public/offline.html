<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#110e1a" />
    <title>Offline · Jawy</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #110e1a;
        color: #f6f0e4;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        color: #ffb238;
        font-size: 28px;
      }
      p {
        margin: 4px 0;
        color: #a8a1b5;
      }
      button {
        margin-top: 20px;
        padding: 10px 24px;
        border: 0;
        border-radius: 999px;
        background: #ffb238;
        color: #110e1a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Jawy" />
      <h1>You’re offline</h1>
      <p>Connect to the internet to keep watching.</p>
      <p dir="rtl" lang="ar">أنت غير متصل بالإنترنت. اتصل لمتابعة المشاهدة.</p>
      <p dir="rtl" lang="he">אין חיבור לאינטרנט. התחברו כדי להמשיך לצפות.</p>
      <button type="button" onclick="location.reload()">Try again · إعادة المحاولة · נסו שוב</button>
    </main>
  </body>
</html>
